<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="auto">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3498db;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="200" rx="15" ry="15" fill="url(#grad1)" />
  <g transform="translate(50, 100)">
    <circle cx="0" cy="0" r="30" fill="#ffffff" opacity="0.2" />
    <path d="M-15,10 L-5,-10 L5,-5 L15,-15 L25,0 L15,15 Z" fill="#ecf0f1" filter="url(#shadow)" />
  </g>
  <g transform="translate(700, 50)">
    <circle cx="0" cy="0" r="40" fill="#ffffff" opacity="0.15" />
    <rect x="-20" y="-15" width="15" height="40" fill="#f1c40f" filter="url(#shadow)" />
    <rect x="5" y="-5" width="15" height="30" fill="#e74c3c" filter="url(#shadow)" />
    <rect x="-10" y="-30" width="15" height="55" fill="#2ecc71" filter="url(#shadow)" />
  </g>
  <text x="400" y="90" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow)">GitHub Follower Analytics</text>
  <text x="400" y="130" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" fill="#ecf0f1" text-anchor="middle" filter="url(#shadow)">Understand your audience with powerful visual insights</text>
</svg>
